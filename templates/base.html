<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SGLD — Gestión de Legajos Docentes{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light min-vh-100 d-flex flex-column">

    <!-- Navbar Global -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'dashboard' %}">SGLD</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'docente_list' %}">Docentes</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    {% if user.is_authenticated %}
                        <span class="navbar-text text-white small">
                            👤 {{ user.nombre }} {{ user.apellido }} <span class="badge bg-light text-primary ms-1">{{ user.get_rol_display }}</span>
                        </span>
                        <form method="post" action="{% url 'logout' %}" class="d-inline">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-outline-light btn-sm fw-bold">Cerrar Sesión</button>
                        </form>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <!-- Contenido dinámico de cada vista -->
    <main class="container my-4 flex-grow-1">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white text-center text-muted py-3 border-top mt-auto">
        <small>Sistema de Gestión de Legajos Docentes (SGLD) — 2026</small>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
