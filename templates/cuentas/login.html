<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión — SGLD</title>
    <!-- Bootstrap 5 CSS vendorizado o CDN básico para el login -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center py-4" style="height: 100vh;">
    <main class="form-signin w-100 m-auto" style="max-width: 400px;">
        <div class="card shadow-sm border-0 rounded-4 p-4">
            <div class="text-center mb-4">
                <h1 class="h3 mb-3 fw-bold text-primary">SGLD</h1>
                <p class="text-muted">Gestión de Legajos Docentes</p>
            </div>
            
            <form method="post">
                {% csrf_token %}
                
                {% if form.errors %}
                    <div class="alert alert-danger py-2 small">
                        Email o contraseña incorrectos. Intentá de nuevo.
                    </div>
                {% endif %}

                <div class="mb-3">
                    <label class="form-label small fw-bold">Email institucional</label>
                    {{ form.username }}
                </div>
                
                <div class="mb-3">
                    <label class="form-label small fw-bold">Contraseña</label>
                    {{ form.password }}
                </div>

                <button class="w-100 btn btn-primary py-2 fw-bold" type="submit">Ingresar</button>
            </form>
        </div>
    </main>
</body>
</html>
