{% extends 'base.html' %}
{% block content %}
<div class="container py-4" style="max-width: 500px;">
    <div class="card shadow-sm border-0 rounded-4 p-4">
        <h3 class="text-danger fw-bold mb-3">⚠️ Eliminar Cargo</h3>
        <p>¿Estás seguro de que deseas eliminar el cargo de <strong>{{ object.espacio_curricular }}</strong> para este docente?</p>
        <form method="post">
            {% csrf_token %}
            <div class="d-flex justify-content-between mt-4">
                <a href="{% url 'docente_detail' object.docente.pk %}" class="btn btn-outline-secondary">Cancelar</a>
                <button type="submit" class="btn btn-danger fw-bold">Sí, eliminar</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
