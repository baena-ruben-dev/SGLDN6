{% extends 'base.html' %}

{% block title %}Registrar Docente — SGLD{% endblock %}

{% block content %}
<div class="container" style="max-width: 700px;">
    <div class="card shadow-sm border-0 rounded-4 p-4">
        <h2 class="h4 mb-4 fw-bold text-primary">Registrar Nuevo Docente</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="d-flex justify-content-between mt-4">
                <a href="{% url 'docente_list' %}" class="btn btn-outline-secondary">Cancelar</a>
                <button type="submit" class="btn btn-success px-4 fw-bold">Guardar Docente</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
